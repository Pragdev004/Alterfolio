[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alterfolio-v2"
version = "0.0.0"
description = "Alterfolio V2 backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.32",
    "httpx>=0.27",
    "langgraph==1.2.15",
    "langchain-core==1.6.11",
    "langchain==1.4.6",  # Feature 015: init_chat_model (provider-agnostic analyst LLM)
    "langchain-groq==1.1.3",
    "langchain-openai==1.7.2",  # also OpenRouter and other OpenAI-compatible endpoints via AI_BASE_URL
    "python-dotenv==1.2.4",  # Feature 015: AI_* settings from backend/.env (analyst/settings.py only)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
